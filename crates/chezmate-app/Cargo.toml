[package]
name = "chezmate-app"
description = "Chezmate desktop app: a GPUI front end for chezmoi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "chezmate-app"
path = "src/main.rs"

# Off-screen screenshots for visual checks; see the file for how to run it.
[[test]]
name = "screenshots"
harness = false

[dependencies]
chezmate-core.workspace = true
gpui-kit = { workspace = true, features = ["syntect"] }
anyhow.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
